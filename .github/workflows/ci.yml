name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch + deps
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy opencv-python-headless matplotlib Pillow pytest
      - name: Run tests
        run: pytest -q
      - name: Benchmark smoke (no GIF)
        run: python benchmarks/run.py --frames 40 --no-gif
